name: TP6 - Pruebas automatizadas
on:
  push:
    paths: ['tp6-testing/**', '.github/workflows/tp6-pruebas.yml']
  pull_request:
    paths: ['tp6-testing/**', '.github/workflows/tp6-pruebas.yml']

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp6-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
